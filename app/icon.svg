<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background glow for dark / light browser tab contrast -->
    <filter id="pizza-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Sourdough Wood-Fired Crust Gradient -->
    <linearGradient id="crust-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Melty Golden Mozzarella Cheese Gradient -->
    <linearGradient id="cheese-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- San Marzano Tomato Sauce Base Peeking Out -->
    <linearGradient id="sauce-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Pepperoni Slice 1 Gradient -->
    <radialGradient id="pep-grad-1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Pepperoni Slice 2 Gradient -->
    <radialGradient id="pep-grad-2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="80%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Fresh Basil Leaf Gradient -->
    <linearGradient id="basil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Whole Pizza Slice Group with Drop Shadow -->
  <g filter="url(#pizza-shadow)">
    <!-- Rich Tomato Sauce Edge Underlay -->
    <path
      d="M76 130 C 180 60, 340 68, 444 148 L 268 456 C 262 466, 250 466, 244 456 Z"
      fill="url(#sauce-grad)"
      stroke="#7f1d1d"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Main Molten Cheese Slice Body with Organic Curvature & Tip Melt -->
    <path
      d="M84 138 C 185 76, 335 84, 436 154 L 266 450 C 261 460, 253 468, 248 456 L 222 396 C 218 388, 208 386, 204 394 L 194 416 C 190 424, 180 422, 178 414 L 84 138 Z"
      fill="url(#cheese-grad)"
    />

    <!-- Wood-Fired Sourdough Crust (Thick Puffed Rim with Blisters) -->
    <path
      d="M68 136 C 110 94, 200 60, 260 58 C 320 56, 410 88, 452 144 C 460 156, 448 172, 432 168 C 388 128, 320 98, 260 98 C 200 98, 132 124, 88 162 C 72 176, 60 150, 68 136 Z"
      fill="url(#crust-grad)"
      stroke="#592207"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Charred Wood-Fired Crust Blister Details -->
    <ellipse cx="140" cy="120" rx="14" ry="7" fill="#451a03" opacity="0.65" transform="rotate(-15 140 120)"/>
    <ellipse cx="230" cy="86" rx="20" ry="8" fill="#451a03" opacity="0.6" transform="rotate(-2 230 86)"/>
    <ellipse cx="320" cy="94" rx="16" ry="7" fill="#451a03" opacity="0.65" transform="rotate(12 320 94)"/>
    <ellipse cx="400" cy="130" rx="14" ry="6" fill="#451a03" opacity="0.55" transform="rotate(25 400 130)"/>

    <!-- Pepperoni Slice 1 (Top Center) with Cupped Lip & Charred Edge -->
    <g transform="translate(254, 190)">
      <circle cx="0" cy="0" r="44" fill="url(#pep-grad-1)" stroke="#5c0808" stroke-width="4"/>
      <!-- Inner Grease Cup Highlight -->
      <ellipse cx="-4" cy="-4" rx="34" ry="32" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.55"/>
      <circle cx="10" cy="12" r="5" fill="#fecaca" opacity="0.7"/>
      <circle cx="-12" cy="16" r="3.5" fill="#fecaca" opacity="0.6"/>
    </g>

    <!-- Pepperoni Slice 2 (Right) -->
    <g transform="translate(338, 280)">
      <circle cx="0" cy="0" r="40" fill="url(#pep-grad-2)" stroke="#5c0808" stroke-width="4"/>
      <ellipse cx="-3" cy="-3" rx="30" ry="28" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.5"/>
      <circle cx="8" cy="10" r="4" fill="#fecaca" opacity="0.65"/>
    </g>

    <!-- Pepperoni Slice 3 (Left Lower) -->
    <g transform="translate(196, 290)">
      <circle cx="0" cy="0" r="42" fill="url(#pep-grad-1)" stroke="#5c0808" stroke-width="4"/>
      <ellipse cx="-4" cy="-4" rx="32" ry="30" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.55"/>
      <circle cx="10" cy="10" r="4.5" fill="#fecaca" opacity="0.7"/>
    </g>

    <!-- Half-cut Pepperoni near crust -->
    <g transform="translate(142, 178)">
      <circle cx="0" cy="0" r="32" fill="url(#pep-grad-2)" stroke="#5c0808" stroke-width="3.5"/>
      <ellipse cx="-2" cy="-2" rx="24" ry="22" fill="none" stroke="#fca5a5" stroke-width="2.5" opacity="0.5"/>
    </g>

    <!-- Fresh Basil Leaves -->
    <!-- Basil Leaf 1 (Top Left) -->
    <path
      d="M200 156 C 180 140, 180 176, 206 186 C 226 194, 224 166, 200 156 Z"
      fill="url(#basil-grad)"
      stroke="#0f3d1c"
      stroke-width="2.5"
    />
    <!-- Basil Leaf 2 (Center) -->
    <path
      d="M284 274 C 264 260, 260 292, 284 306 C 308 316, 312 284, 284 274 Z"
      fill="url(#basil-grad)"
      stroke="#0f3d1c"
      stroke-width="2.5"
    />
    <!-- Basil Leaf 3 (Tip) -->
    <path
      d="M246 384 C 232 374, 230 398, 248 406 C 264 412, 266 390, 246 384 Z"
      fill="url(#basil-grad)"
      stroke="#0f3d1c"
      stroke-width="2"
    />

    <!-- Stretchy Cheese Strings & Drips extending from the hot slice tip -->
    <path
      d="M248 456 C 246 474, 252 488, 254 494 C 255 498, 259 498, 260 494 C 262 484, 264 466, 262 454 Z"
      fill="#fde047"
    />
    <path
      d="M236 438 C 234 452, 238 466, 240 472 C 241 475, 244 475, 245 472 C 246 464, 246 450, 244 440 Z"
      fill="#fef08a"
    />
  </g>
</svg>
